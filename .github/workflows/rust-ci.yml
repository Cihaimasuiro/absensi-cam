name: Rust CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'clients/edge-engine-rs/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'clients/edge-engine-rs/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev

      - name: Install Rust toolchain (1.91.0)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: clients/edge-engine-rs -> target

      - name: Run Clippy
        working-directory: clients/edge-engine-rs
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests (Lib & Bins)
        working-directory: clients/edge-engine-rs
        run: cargo test --lib --bins -- --nocapture

      - name: Verify ONNX Runtime Packaging, Smoke Test & Parity Test
        working-directory: clients/edge-engine-rs
        run: |
          bash ./scripts/package-onnxruntime.sh --arch x86_64
          ORT_DYLIB_PATH="$(pwd)/dist/onnxruntime/x86_64/libonnxruntime.so" cargo test --test pipeline_test --test extract_parity_test -- --nocapture



  cross-check:
    name: Cross-Check (Linux aarch64 & armv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cross-compilation packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Install Rust targets (1.91.0)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: clients/edge-engine-rs -> target

      - name: Check aarch64 target
        working-directory: clients/edge-engine-rs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --target aarch64-unknown-linux-gnu

      - name: Check armv7 target (32-bit SBCs)
        working-directory: clients/edge-engine-rs
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo check --target armv7-unknown-linux-gnueabihf

  windows-check:
    name: Windows Native Camera Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (1.91.0)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: clients/edge-engine-rs -> target

      - name: Check Windows Native Camera (Default)
        working-directory: clients/edge-engine-rs
        run: cargo check --bins --tests

      - name: Check Windows Fallback (No Default Features)
        working-directory: clients/edge-engine-rs
        run: cargo check --bins --tests --no-default-features

  test-arm64-native:
    name: Test (aarch64 native)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Run tests
        working-directory: clients/edge-engine-rs
        run: cargo test --lib --bins --no-default-features

  test-macos:
    name: Test (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - working-directory: clients/edge-engine-rs
        run: cargo check --bins --tests
