<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi-Cam · Admin Shell</title>
  <style>
    :root {
      --bg: #141715;
      --card-bg: #1C201D;
      --border: #2D332F;
      --text: #F0F2F1;
      --text-muted: #9BA39D;
      --accent: #2E7D32;
      --accent-hover: #388E3C;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .status-text {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .hint {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: left;
    }
    .hint code {
      color: #81C784;
      font-family: monospace;
      font-size: 12px;
    }
    .btn {
      background-color: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Absensi-Cam · Shell Desktop</h1>
    <p id="status" class="status-text">Menghubungkan ke server Laravel (http://127.0.0.1:8000)...</p>
    <div class="hint">
      Pastikan server web lokal sudah berjalan di terminal:<br>
      <code>php artisan serve</code>
    </div>
    <button id="retry-btn" class="btn" onclick="checkConnection()">
      <span id="btn-spinner" class="spinner"></span>
      <span id="btn-text">Memeriksa...</span>
    </button>
  </div>

  <script>
    const TARGET_URL = 'http://127.0.0.1:8000';
    let isChecking = false;

    async function checkConnection() {
      if (isChecking) return;
      isChecking = true;

      const statusEl = document.getElementById('status');
      const btnEl = document.getElementById('retry-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      btnEl.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Memeriksa...';
      statusEl.textContent = 'Memeriksa ketersediaan server Laravel...';

      try {
        if (window.__TAURI__ && window.__TAURI__.core) {
          const isHealthy = await window.__TAURI__.core.invoke('check_server_health');
          if (isHealthy) {
            statusEl.textContent = 'Terhubung! Mengalihkan ke aplikasi...';
            window.location.href = TARGET_URL;
            return;
          }
        } else {
          await fetch(TARGET_URL + '/up', { mode: 'no-cors' });
          statusEl.textContent = 'Terhubung! Mengalihkan...';
          window.location.href = TARGET_URL;
          return;
        }
      } catch (err) {
        statusEl.textContent = 'Server belum aktif atau tidak merespons di ' + TARGET_URL;
      } finally {
        isChecking = false;
        btnEl.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Coba Lagi';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkConnection();
    });
  </script>
</body>
</html>
